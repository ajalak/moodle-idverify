# Moodle plugin checks and PHPUnit tests (moodle-plugin-ci). Moodle 5.2+ only (public/ layout).
# Two plugins live in this repository (not in its root): local/idverify and the customcert element
# mod/customcert/element/idverify. Each is tested in its own job; mod_customcert is added from GitHub, and the
# element job also installs local_idverify from this checkout as an extra plugin.

name: Moodle Plugin CI

# Only plugin code changes trigger CI (docs-only commits don't).
on:
  push:
    paths: ['local/**', 'mod/**', '.github/workflows/**']
  pull_request:
    paths: ['local/**', 'mod/**', '.github/workflows/**']

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            plugin: 'local/idverify'
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            plugin: 'mod/customcert/element/idverify'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Add mod_customcert
        run: moodle-plugin-ci add-plugin mdjnelson/moodle-mod_customcert --branch MOODLE_502_STABLE

      - name: Add local_idverify as a dependency of the element
        if: ${{ matrix.plugin != 'local/idverify' }}
        run: cp -r plugin/local/idverify moodle-plugin-ci-plugins/local_idverify

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin/${{ matrix.plugin }} --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt (JavaScript lint and AMD build check)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
